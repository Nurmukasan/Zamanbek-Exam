name: Publish website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript
        run: node --check script.js
      - name: Prepare static files
        run: |
          mkdir -p /tmp/forma-site
          cp index.html styles.css script.js .nojekyll /tmp/forma-site/
          cp -R assets /tmp/forma-site/
      - name: Update publishing branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: /tmp/forma-site
      # Token-authenticated pushes do not trigger a Pages build by themselves.
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" > /dev/null
      - name: Verify the published page matches this version
        env:
          SITE_URL: https://nurmukasan.github.io/Zamanbek-Exam/
        run: |
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error "$SITE_URL" --output /tmp/published.html && cmp --silent index.html /tmp/published.html; then
              echo "Published website verified: $SITE_URL"
              exit 0
            fi
            sleep 10
          done
          echo "The published page did not match the expected version within four minutes."
          exit 1
